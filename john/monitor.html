<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>JOHN Monitor</title><style>
:root{--bg:#07080a;--panel:#0f1115;--line:#262a31;--gold:#d4ae63;--text:#f4f1e9;--muted:#858b96;--good:#63d69d;--bad:#ff7979}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2a2113 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}.back{color:var(--gold);text-decoration:none;font-weight:800}.live{font-size:11px;border:1px solid #28513f;color:var(--good);padding:8px 10px;border-radius:999px}.hero,.card{background:linear-gradient(145deg,#121419dd,#0b0d10ee);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px #0006}.hero{padding:23px}.hero small,.card small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.hero h1{font:500 34px Georgia,serif;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.card{padding:17px}.v{font-size:22px;font-weight:800;margin-top:8px}.rows{margin-top:8px}.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #1d2025;font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}.events{display:grid;gap:8px;margin-top:10px}.event{border:1px solid #20242a;background:#090b0e;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;font-size:12px}.event time{color:var(--muted)}button{border:1px solid #514021;background:#15120c;color:#e7c783;border-radius:999px;padding:10px 13px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:13px}}
</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">← JOHN</a><span class="live">● LIVE MONITOR</span></header><section class="hero"><small>SEPARATE OPERATIONS VIEW</small><h1>Market & execution health</h1><div style="display:flex;justify-content:space-between;align-items:center"><span id="health">Connecting…</span><button id="refresh">↻ Refresh</button></div></section><section class="grid"><article class="card"><small>Latency</small><div class="v" id="latency">—</div></article><article class="card"><small>Last run</small><div class="v" id="lastRun">—</div><div id="lastRunSub" style="color:#858b96;font-size:11px"></div></article><article class="card"><small>Pending approval</small><div class="v" id="pending">None</div></article></section><section class="card" style="margin-top:10px"><small>SERVICES</small><div class="rows" id="services"></div></section><section class="card" style="margin-top:10px"><small>RECENT EVENTS</small><div class="events" id="events"></div></section></main><script>
const D={statusUrl:'https://alalex.app.n8n.cloud/webhook/john-v53/status'},C=()=>({...D,...JSON.parse(localStorage.getItem('johnCfg')||'{}')}),$=x=>document.getElementById(x);function row(a,b,c=''){return '<div class="row"><span>'+a+'</span><span class="'+c+'">'+b+'</span></div>'}function ev(a,b){return '<div class="event"><span>'+a+'</span><time>'+((b)||'')+'</time></div>'}async function refresh(){let s=performance.now();try{let r=await fetch(C().statusUrl,{cache:'no-store'}),d=await r.json();$('latency').textContent=Math.round(performance.now()-s)+' ms';$('health').textContent=d.ok===false?'Degraded':'Online';$('health').className=d.ok===false?'bad':'good';$('lastRun').textContent=d.lastRun?.status||'Live';$('lastRunSub').textContent=d.lastRun?.at||new Date().toLocaleTimeString();let p=d.proposal||d.tradeProposal||d.pendingTrade;$('pending').textContent=p?.id&&!['approved','rejected','expired'].includes(String(p.status||'pending').toLowerCase())?(p.pair||p.instId||'Pending'):'None';$('services').innerHTML=[row('Market feed',d.market?.ok?'Online':'Unavailable',d.market?.ok?'good':'bad'),row('Account read',d.account?.ok?'Authorized':'Unavailable',d.account?.ok?'good':'bad'),row('Scanner',d.scanner?.state||'Idle',d.scanner?.state?'good':''),row('Confirmation gate','Required','good')].join('');let e=(d.events||[]).slice(0,15);$('events').innerHTML=e.length?e.map(x=>ev(x.message||x.type||'Event',x.time)).join(''):ev('No recent events','')}catch(e){$('health').textContent='Offline';$('health').className='bad';$('services').innerHTML=row('Backend','Unavailable','bad');$('events').innerHTML=ev('Status endpoint unavailable','')}}$('refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></body></html>
