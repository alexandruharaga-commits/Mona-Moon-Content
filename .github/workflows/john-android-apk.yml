name: Build JOHN Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'john/android/**'
      - '.github/workflows/john-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: john/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp john/android/app/build/outputs/apk/debug/app-debug.apk JOHN_v5_6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JOHN_v5_6_APK
          path: JOHN_v5_6.apk
          if-no-files-found: error
          retention-days: 30
