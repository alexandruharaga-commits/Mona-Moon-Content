name: Build HUNTER ALPHA v0.3 APK
on:
  push:
    branches: [ hunter-alpha-v0.3 ]
    paths:
      - 'hunter-android/**'
      - 'hunter-connect/**'
      - '.github/workflows/hunter-alpha-v03-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: hunter-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HUNTER-ALPHA-v0.3-debug
          path: hunter-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error