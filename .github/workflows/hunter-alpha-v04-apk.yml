name: Build HUNTER ALPHA v0.6.1 Release

on:
  push:
    branches: [ hunter-alpha-v0.4 ]
    paths:
      - 'hunter-android/**'
      - '.github/workflows/hunter-alpha-v04-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        working-directory: hunter-android
        run: gradle assembleRelease --no-daemon

      - name: Prepare local signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner

      - uses: actions/upload-artifact@v4
        with:
          name: HUNTER-ALPHA-v0.6.1-unsigned
          path: hunter-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: HUNTER-ANDROID-SIGNING-TOOLS
          path: signing-tools/**
          if-no-files-found: error
